# Issue 18.12 — CI enforcement of forbidden user-facing terms.
# Per Design Spec §15.2: never use "gas", "blockchain", "transaction" (in user copy),
# "decentralized storage", "hashes", or "revisions" in user-visible surfaces.

name: Forbidden Terms Check

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'design/**'
      - 'README.md'
      - '**/*.md'

jobs:
  forbidden-terms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Scan user-facing surfaces
        run: |
          set -e
          ALLOWLIST=".github/forbidden-terms-allowlist.txt"
          PATTERNS='\bgas\b|\bblockchain\b|\bdecentralized storage\b|\bhashes\b|\brevisions\b'

          # Scan apps/ aggressively (user-facing) + README.md
          # (top-level developer landing). The `design/` dir was
          # listed historically but does not exist in the current
          # repo layout — drop it so `rg` doesn't error.
          # Use `--no-messages` so a missing path is silently
          # skipped instead of breaking the pipeline.
          # rg exits 0 on hits AND 1 on no-match; the `|| true` keeps
          # the pipeline going either way (we read the file next).
          rg --pcre2 -n -i --no-messages "$PATTERNS" apps/ README.md \
            > /tmp/forbidden-hits.txt 2>&1 || true

          # Apply the allowlist: drop hits whose `path:line:content`
          # line matches ANY non-comment, non-empty allowlist regex.
          # The allowlist patterns are POSIX extended regex (grep -E).
          if [ -s "$ALLOWLIST" ]; then
            # Build a single combined alternation from non-comment,
            # non-empty allowlist lines. `sed` strips comments and
            # blanks; `tr` joins with `|` for grep -E.
            COMBINED=$(sed -E '/^[[:space:]]*#/d; /^[[:space:]]*$/d' "$ALLOWLIST" \
              | tr '\n' '|' | sed 's/|$//')
            if [ -n "$COMBINED" ]; then
              grep -Ev "$COMBINED" /tmp/forbidden-hits.txt \
                > /tmp/forbidden-hits.filtered || true
              mv /tmp/forbidden-hits.filtered /tmp/forbidden-hits.txt
            fi
          fi

          if [ -s /tmp/forbidden-hits.txt ]; then
            echo ""
            echo "::error::Forbidden user-facing terms detected. See Design Spec §15.2."
            echo "If a usage is legitimate (internal Rust/JS doc, test fixture,"
            echo "or developer-only README) add the path-anchored regex to $ALLOWLIST."
            echo ""
            cat /tmp/forbidden-hits.txt
            exit 1
          fi

          echo "No forbidden user-facing terms detected (allowlist applied)."
